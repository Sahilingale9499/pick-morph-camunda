events {
    worker_connections 1024;
}

http {
    # Use API key header as the rate-limit key when present, otherwise fall back to client IP
    map $http_x_api_key $rl_key {
        default $binary_remote_addr;
        ~.+ $http_x_api_key;
    }

    # Rate limit by client IP: configure sustained rate and burst.
    # Tuning chosen: sustained 10 requests/sec per IP, burst up to 100 requests.
    # Zone size controls how many unique clients are tracked: ~8 bytes per entry.
    # 50m -> ~6.5M entries; adjust downward if memory-constrained.
    # Zones share the same keying variable ($rl_key) so API-keys are rate-limited by key
    limit_req_zone $rl_key zone=api_rate:50m rate=10r/s;
    # Admin endpoints get a stricter limit
    limit_req_zone $rl_key zone=admin_rate:10m rate=1r/s;
    limit_req_status 429;

    # Docker internal DNS — resolves spring-camunda at request time, not startup
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;

        # API endpoints
        location / {
            # Allow burst of 100 requests per key; excess will be delayed (smoothing).
            limit_req zone=api_rate burst=100;

            # Variable-based proxy so DNS resolves per-request (handles replicas starting after nginx)
            set $upstream http://spring-camunda:9191;
            proxy_pass $upstream;

            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;

            add_header X-RateLimit-Limit  10;
            add_header X-RateLimit-Burst  100;
            # X-RateLimit-Reset indicates window semantics (approx seconds until reset)
            add_header X-RateLimit-Reset  60;
        }

        # Admin API — stricter limits
        location /api/admin/ {
            # Apply admin-specific stricter zone
            limit_req zone=admin_rate burst=20;

            set $upstream http://spring-camunda:9191;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check — no rate limit
        location /actuator/health {
            set $upstream http://spring-camunda:9191;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }
    }
}
