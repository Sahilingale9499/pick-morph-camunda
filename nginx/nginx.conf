upstream spring_temporal_cluster {
    # Docker DNS resolves 'spring-temporal' to all scaled instances (round-robin by default)
    server spring-temporal:9191;

    # Nginx will round-robin across all containers with this name when scaled with:
    # docker compose up --scale spring-temporal=3
    keepalive 32;
}

server {
    listen 80;

    # Health check endpoint passthrough
    location /actuator/health {
        proxy_pass         http://spring_temporal_cluster;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
    }

    # All API traffic
    location / {
        proxy_pass         http://spring_temporal_cluster;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts (Temporal workflow start can take a moment)
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
