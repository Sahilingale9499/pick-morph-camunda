spring.application.name=spring-camunda

server.port=9191
debug=true

# Kafka Bootstrap Servers (supports Docker env override)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Default consumer group (overridden per-listener in @KafkaListener)
spring.kafka.consumer.group-id=pick-workflow-consumer-group
# Default key and value serializers/deserializers for convenience
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Database (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vijay.j}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# Camunda BPM
camunda.bpm.database.schema-update=true
camunda.bpm.history-level=full
camunda.bpm.auto-deployment-enabled=true
camunda.bpm.job-execution.enabled=true
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.filter.create=All Tasks

# Butler Core gRPC configuration
butler.core.grpc.address=${BUTLER_GRPC_ADDR:gmc_butler_server:9090}

# Butler server HTTP API configuration
butler.http.host=${BUTLER_HTTP_HOST:gmc_butler_server}
butler.http.port=${BUTLER_HTTP_PORT:8181}
butler.http.timeout-ms=${BUTLER_HTTP_TIMEOUT_MS:5000}

# Butler Pick Order gRPC configuration (PickOrderService on butler_server port 50051)
butler.pick.grpc.address=${BUTLER_PICK_GRPC_ADDRESS:gmc_butler_server:50051}
butler.pick.grpc.timeout-seconds=${BUTLER_PICK_GRPC_TIMEOUT_SECONDS:30}
butler.pick.grpc.mock-enabled=${BUTLER_PICK_GRPC_MOCK_ENABLED:true}
butler.core.grpc.timeout-seconds=${BUTLER_CORE_GRPC_TIMEOUT:30}

# Location service HTTP API configuration
location.service.host=${LOCATION_SERVICE_HOST:location-service}
location.service.port=${LOCATION_SERVICE_PORT:8080}
# Mock mode - set to false when real Butler Core is available
butler.core.grpc.mock-enabled=${BUTLER_CORE_MOCK_ENABLED:true}

# Kafka tenant ID and topic names
kafka.tenant-id=${KAFKA_TENANT_ID:gor}
kafka.topics.pick-instructions-request=${kafka.tenant-id}.pick_instructions.request
kafka.topics.pick-instruction-response=${kafka.tenant-id}.pick_instruction.response
kafka.topics.pick-list-requests=${kafka.tenant-id}.pick_list.requests
kafka.topics.pick-list-response=${kafka.tenant-id}.pick_list.response
kafka.topics.transaction-updates=${kafka.tenant-id}.transaction_updates
kafka.topics.transaction-events=${kafka.tenant-id}.transaction_events
kafka.topics.workflow-complete-events=${kafka.tenant-id}.workflow_complete_events

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Rate limiting (per-IP fixed-window)
# Maximum requests per window (default 100)
ratelimit.requests=100
# Window size in seconds (default 60)
ratelimit.windowSeconds=60

# Rate limit backend: 'nginx' (recommended) or 'java' to enable in-app limiter
ratelimit.backend=nginx